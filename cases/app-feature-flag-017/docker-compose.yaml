services:
  target:
    build:
      context: ../..
      dockerfile: cases/app-feature-flag-017/Dockerfile
      args:
        CASE_DIR: cases/app-feature-flag-017
    hostname: target
    working_dir: /agent-runtime
    cpus: 1.00
    mem_limit: 384m
    pids_limit: 128
    tmpfs:
      - /data:size=24m,nr_inodes=256,mode=0777
      - /var/cache/demo:size=8m,mode=0777
    volumes:
      - ${OPSBENCH_AGENT_SOURCE}:/agent:ro
      - ${OPSBENCH_TASK_SOURCE}:/task/task.md:ro
      - ${OPSBENCH_AGENT_TRACE_DIR}:/trace
