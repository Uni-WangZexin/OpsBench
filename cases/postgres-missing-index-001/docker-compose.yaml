services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opsbench
      POSTGRES_USER: opsbench
      POSTGRES_PASSWORD: opsbench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbench -d opsbench"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
