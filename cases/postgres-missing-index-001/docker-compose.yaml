services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opsbench
      POSTGRES_USER: opsbench
      POSTGRES_PASSWORD: opsbench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbench -d opsbench"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  agent-runner:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: agents/langchain-react-agent/Dockerfile
    working_dir: /agent-runtime
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-pro}
      LANGCHAIN_MAX_STEPS: ${LANGCHAIN_MAX_STEPS:-30}
      LANGCHAIN_TEMPERATURE: ${LANGCHAIN_TEMPERATURE:-0}
      PGHOST: db
      PGDATABASE: opsbench
      PGUSER: opsbench
      PGPASSWORD: opsbench
    depends_on:
      db:
        condition: service_healthy
